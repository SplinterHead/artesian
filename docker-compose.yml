services:
  artesian:
    build:
      context: .
      dockerfile: Dockerfile
    image: artesian:latest
    container_name: artesian
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "80:80/tcp"
      - "8080:8080/tcp"

    volumes:
      - ./data/cache:/data/cache
      - ./data/db:/data
      - ./data/manifests:/data/manifests
      - ${HOME}/Library/Application Support/Steam/depotcache:/data/steam_depotcache:ro
    environment:
      - TZ=UTC
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
